version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert

  exclusions:
    rules:
      # unsafe is unavoidable for Win32 syscalls
      - path: _windows\.go
        linters: [gosec]
        text: G103

formatters:
  enable:
    - gofmt
