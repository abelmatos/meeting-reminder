name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # Linux with cgo: the race detector needs it, and the Windows build job
  # runs with CGO_ENABLED=0.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Test with the race detector
        run: go test -race ./...

      - name: Known vulnerabilities
        # Install for the runner first: GOOS=windows go run would build a
        # Windows binary.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...

  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      # Windows runners support audit mode only.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release binaries are built from a clean module cache, never one a
          # PR run could have written.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Vet and test
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Build Windows binary
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            # Stamp the release version into the exe's version resource.
            go tool go-winres make --arch amd64 \
              --product-version "${version#v}" --file-version "${version#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.version=$version" -o reminder.exe .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reminder-exe
          path: reminder.exe
          retention-days: 90
          if-no-files-found: error

  # Its own job so the OIDC token (id-token) stays out of the job that
  # writes the release.
  attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reminder-exe

      # Signed statement that reminder.exe was built by this workflow from
      # this commit: verify with `gh attestation verify reminder.exe -R abelmatos/meeting-reminder`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reminder.exe

  release:
    needs: [attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reminder-exe

      - name: Checksums
        run: sha256sum reminder.exe > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" reminder.exe SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
